[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nervus"
version = "0.4.0"
description = "MCP bastion giving AI agents programmatic SSH access to the operator's home fleet"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "asyncssh==2.24.0",
    "pyyaml==6.0.3",
    "anyio==4.11.0",
    "uvicorn==0.54.0",
    "cryptography==50.0.2",
    "starlette==1.7.0",
    "python-multipart==0.0.32",
]

[project.scripts]
nervus = "nervus.__main__:main"
nervus-ctl = "nervus.ctl:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nervus"]

[tool.pytest.ini_options]
# tests/ is nervus's; deployment/tests/ is this instance's deployment record (ADR-0018).
testpaths = ["tests", "deployment/tests"]
asyncio_mode = "auto"
